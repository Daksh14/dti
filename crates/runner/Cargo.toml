[package]
name = "dti-runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
http-body-util.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
wasmtime-wasi-http.workspace = true
# Workers train only through wasi:nn with this PyTorch backend, so the runner
# needs libtorch 2.4 to build (see the README).
wasmtime-wasi-nn = { workspace = true, features = ["pytorch"] }
# Same version as wasmtime-wasi-nn uses; for the CUDA check and thread count.
tch = { version = "0.17", default-features = false }
bytes = "1"
http = "1"
http-body = "1"

